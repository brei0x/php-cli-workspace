name: Publish

# Builds and pushes the image on every push to main, then tags the commit and publishes
# its release. A tag push rebuilds nothing: the release names the image already published.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly rebuild picks up PHP and Debian patches; no release

permissions:
  contents: read

# Serialized: a cleanup running beside another run's build would delete its digests before merge.
concurrency:
  group: publish
  cancel-in-progress: false

# Single source of truth for which PHP version carries the `latest` tag.
env:
  LATEST_PHP: "8.5"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        arch: [arm64, amd64]
        include: # each platform builds natively: no QEMU, the extensions compile at full speed
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/php-cli-workspace

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/php-cli-workspace,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.php }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/php-cli-workspace
          tags: |
            type=raw,value=${{ matrix.php }}
            type=raw,value=latest,enable=${{ matrix.php == env.LATEST_PHP }}

      - name: Create and push manifest
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("ghcr.io/${GITHUB_REPOSITORY_OWNER}/php-cli-workspace@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
        working-directory: /tmp/digests

  # Drops the untagged trees of earlier runs; children still referenced by a tag are kept.
  cleanup:
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      packages: write
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          validate: true

  release:
    if: github.event_name == 'push'
    needs: merge
    uses: tekalib/.workflows/.github/workflows/release.yml@1494e487e05e771c4103be2ba30ce1716dde519c # v1.1.0
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}

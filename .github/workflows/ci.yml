name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build PHP ${{ matrix.php }} on ${{ matrix.arch }} and list its extensions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"] # same versions as publish.yml
        arch: [arm64, amd64]
        include: # same native runner per platform as publish.yml
          - arch: arm64
            runner: ubuntu-26.04-arm
          - arch: amd64
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          load: true
          tags: php-cli-workspace:ci

      - run: docker run --rm php-cli-workspace:ci php -m
